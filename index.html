<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef0ee" />
    <script>
      try {
        var saved = localStorage.getItem('keyfall-v2')
        var theme = saved && JSON.parse(saved).theme === 'dark' ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
    <meta name="description" content="鍵雨：繁體中文打字遊戲。詞語落下，用注音或倉頡打完。也可切換英文練習。" />
    <title>鍵雨 — 中文打字遊戲</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="shell">
      <header class="bar">
        <button id="home" class="brand" type="button" aria-label="回主選單">
          <span class="seal" aria-hidden="true"></span>
          <span class="brand-name">鍵雨</span>
        </button>
        <div id="hud" class="hud" hidden></div>
        <div class="tools">
          <button id="theme" class="tool" type="button" aria-pressed="false">淺色</button>
          <button id="pause" class="tool" type="button" hidden>暫停</button>
          <button id="mute" class="tool" type="button" aria-pressed="false">音效開</button>
        </div>
      </header>
      <div id="ad-banner"></div>
      <main id="stage">
        <aside id="log" aria-label="打過的詞">
          <h2>打過的詞</h2>
          <ol id="log-list"></ol>
          <p id="log-empty">打完的詞會出現在這裡。</p>
        </aside>
        <div class="playcol">
          <div id="world"></div>
          <div id="ime-dock" hidden>
            <label for="ime">組字</label>
            <input
              id="ime"
              lang="zh-Hant"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="done"
              aria-label="中文輸入"
            />
            <p id="ime-preview" class="compose" aria-live="off"></p>
          </div>
          <div id="overlay"></div>
        </div>
        <aside id="rail">
          <div id="ad-sidebar"></div>
          <a id="coffee" class="coffee" target="_blank" rel="noopener noreferrer">請我喝杯咖啡</a>
        </aside>
      </main>
    </div>
    <div id="live" class="sr" aria-live="polite"></div>
    <noscript>這個遊戲需要啟用 JavaScript。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
