# 鍵雨：一支 Worker 同時提供遊戲靜態檔（dist/）與 Stripe 付款 API。
# 部署：npm run deploy（會先 build）。密鑰用 wrangler secret put 設定，見 README。
name = "keyfall"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "keyfall"
database_id = "00000000-0000-0000-0000-000000000000"   # 執行 `npx wrangler d1 create keyfall` 後貼上

[observability]
enabled = true
