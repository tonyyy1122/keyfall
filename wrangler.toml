# 鍵雨：一支 Worker 同時提供遊戲靜態檔（dist/）與 Stripe 付款 API。
# 部署：npm run deploy（會先 build）。密鑰用 wrangler secret put 設定，見 README。
name = "keyfall"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# stonedemo.com 有一條 *.stonedemo.com/* 指向 nail-saas，所以要再加一條更精確的路由蓋過它（jobs 子網域也是這樣做）。
routes = [
  { pattern = "keyfall.stonedemo.com", custom_domain = true },
  { pattern = "keyfall.stonedemo.com/*", zone_name = "stonedemo.com" },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "keyfall"
database_id = "80e27964-2df1-4077-ae59-d8bad4e1b8fd"

[observability]
enabled = true
